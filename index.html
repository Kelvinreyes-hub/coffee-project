<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Coffee Learning Hub</title>
  <style>
    :root{--ink:#132426;--cream:#fff1c9;--paper:#f7dfaa;--paper2:#ffefc8;--teal:#287270;--rust:#a94e37;--gold:#f2b850;--line:#40271d}
    *{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#0a191b}body{font-family:"Courier New",monospace;color:var(--cream)}
    .stage{height:100%;display:grid;place-items:center;background:radial-gradient(circle,#315a58,#091719 75%)}.game{position:relative;width:min(100vw,160vh);aspect-ratio:16/10;background:url("assets/game-room.png") center/cover no-repeat;overflow:hidden;box-shadow:0 0 0 5px #071113,0 25px 70px #000b}
    .hotspot{position:absolute;z-index:5;border:0;background:transparent;cursor:pointer}.hotspot:focus-visible{outline:3px solid var(--gold);outline-offset:3px}.hotspot:hover:after{content:attr(aria-label);position:absolute;left:50%;top:105%;transform:translateX(-50%);white-space:nowrap;padding:5px 7px;background:#102325;border:2px solid var(--gold);color:var(--cream);font:bold 11px "Courier New",monospace}
    .nav-learning{left:33%;top:2%;width:11%;height:7%}.nav-employment{left:45%;top:2%;width:12%;height:7%}.nav-involvement{left:58%;top:2%;width:12%;height:7%}.nav-news{left:71%;top:2%;width:8%;height:7%}.nav-about{left:80%;top:2%;width:18%;height:7%}
    .shelf-employment{left:25%;top:27%;width:14%;height:18%}.shelf-involvement{left:62%;top:27%;width:14%;height:18%}
    .book-stage{position:absolute;z-index:4;left:20%;top:39%;width:60%;height:auto;aspect-ratio:1586/992;perspective:1500px;transform-style:preserve-3d;--return-x:0%;--enter-x:0%;pointer-events:none}
    .book-stage.returning{animation:returnBook .58s cubic-bezier(.4,0,.4,1) forwards}.book-stage.arriving{animation:arriveBook .7s cubic-bezier(.18,.78,.25,1) both}@keyframes returnBook{to{opacity:.2;transform:translate(var(--return-x),-92%) rotateX(32deg) scale(.24,.08)}}@keyframes arriveBook{from{opacity:.12;transform:translate(var(--enter-x),-92%) rotateX(32deg) scale(.24,.08)}60%{opacity:1;transform:translate(0,4%) rotateX(-4deg) scale(1.03,.98)}to{opacity:1;transform:none}}
    .book{position:absolute;inset:0;background:url("assets/open-book-frame.png") center/100% 100% no-repeat;filter:drop-shadow(0 18px 12px #26100599);transform-style:preserve-3d;pointer-events:auto}
    .page{position:absolute;z-index:1;top:7%;height:61%;padding:2.5% 3%;overflow:visible;background:transparent;border:0}.left{left:5%;width:41%;display:grid;grid-template-rows:auto minmax(0,1fr)}.right{right:5%;width:41%;display:flex;flex-direction:column}.page::before,.left::after{display:none}
    .topic-index,.caption{display:none}.left h1{position:relative;z-index:2;margin:.08em 0 0;color:#38231b;text-align:center;white-space:nowrap;letter-spacing:-.035em;font-size:clamp(12px,1.8vw,28px);line-height:1}.story{width:80%;min-height:0;display:grid;place-items:center;margin:-2% auto 5%;overflow:visible;background:transparent;border:0;border-radius:0}.story img{display:block;width:100%;height:94%;max-width:100%;max-height:100%;object-fit:contain;object-position:center center;transform:translateY(-6%);image-rendering:pixelated}
    .right h2{position:relative;z-index:2;flex:0 0 auto;margin:.4% 0 3%;text-align:center;color:#38231b;font-size:clamp(11px,1.3vw,20px)}.modules{position:relative;z-index:2;width:84%;min-height:0;flex:0 1 72%;max-height:72%;margin:0 auto 3%;display:grid;grid-template-rows:repeat(var(--module-count,5),minmax(0,1fr));gap:clamp(2px,.32vw,5px)}.modules button{display:flex;align-items:center;gap:7%;width:100%;min-height:0;height:100%;padding:0 6%;color:#2c211b;background:#fff6d9;border:2px solid #352820;border-radius:7px;font:bold clamp(8px,.85vw,14px) "Courier New",monospace;cursor:pointer;box-shadow:2px 2px 0 #9b603b}.modules button:hover,.modules button.active{background:#fff0ad;transform:translate(-1px,-1px)}.badge{display:grid;place-items:center;flex:0 0 clamp(17px,1.85vw,26px);height:clamp(17px,1.85vw,26px);color:#fff7d7;background:var(--teal);border-radius:3px}.arrow{margin-left:auto;font-size:1.2em}
    .book-controls{position:absolute;z-index:8;left:11%;right:11%;bottom:9%;display:flex;justify-content:space-between;pointer-events:auto}.book-controls button{width:25%;height:10%;padding:0;color:transparent;background:transparent;border:0;box-shadow:none;cursor:pointer}.book-controls button:focus-visible{outline:3px solid var(--gold);outline-offset:4px}
    .fold{position:absolute;z-index:10;left:5%;top:7%;width:41%;height:61%;padding:2.5% 3%;opacity:0;pointer-events:none;transform-origin:right center;transform-style:preserve-3d;backface-visibility:hidden;background:linear-gradient(100deg,#fff8dc,#efd093 74%,#bf7744);border:0;clip-path:polygon(4% 2%,97% 0,100% 98%,2% 100%,0 94%,0 9%);box-shadow:inset -18px 0 22px #a25f38}.fold.turn-forward{animation:flipForward .62s cubic-bezier(.2,.7,.25,1)}.fold.turn-back{transform-origin:left center;left:54%;clip-path:polygon(2% 0,96% 2%,100% 9%,100% 94%,98% 100%,0 98%);animation:flipBack .62s cubic-bezier(.2,.7,.25,1)}@keyframes flipForward{0%{opacity:0;transform:translateZ(0) rotateY(0)}8%{opacity:1}48%{opacity:1;transform:translateZ(115px) rotateY(-75deg)}100%{opacity:0;transform:translateZ(0) rotateY(-180deg)}}@keyframes flipBack{0%{opacity:0;transform:translateZ(0) rotateY(0)}8%{opacity:1}48%{opacity:1;transform:translateZ(115px) rotateY(75deg)}100%{opacity:0;transform:translateZ(0) rotateY(180deg)}}.fold h3{margin:.4em 0;color:#4a2d1f;text-align:center;font-size:clamp(12px,2vw,28px)}.fold-lines{margin-top:12%;height:55%;background:repeating-linear-gradient(0deg,transparent 0 14px,#9e643f 15px 19px,transparent 20px 33px);opacity:.45}
    .modal{position:absolute;z-index:12;display:none;left:50%;top:29%;width:32%;padding:2%;transform:translateX(-50%);text-align:center;color:#3a281c;background:var(--cream);border:5px solid #152425;box-shadow:9px 9px #0b1718}.modal.show{display:block}.modal h2{margin:0 0 8px}.modal button{padding:8px 12px;color:#fff3cd;background:var(--teal);border:3px solid #152425;font-weight:bold;cursor:pointer}
    .hint{position:absolute;z-index:9;left:2%;bottom:2%;color:#ffe198;text-shadow:2px 2px #161919;font-size:clamp(7px,.75vw,12px)}
    @media(max-width:700px){.book-stage{left:12%;width:76%;top:43%;height:auto;aspect-ratio:1586/992}.page{padding:2.5%}.left h1{font-size:clamp(10px,2.7vw,13px);letter-spacing:-.055em}.story{width:78%;margin:-2% auto 4%}.story img{height:92%;transform:translateY(-5%)}.right h2{font-size:11px}.modules{width:82%;flex-basis:70%;max-height:70%;gap:2px}.modules button{border-width:1px;border-radius:4px;padding:0 5%;font-size:7px;box-shadow:1px 1px 0 #9b603b}.badge{flex-basis:15px;height:15px}.modal{width:66%}.hotspot:hover:after{display:none}}
  </style>
</head>
<body>
  <main class="stage"><section id="game" class="game" aria-label="Coffee Learning Hub game scene">
    <button class="hotspot nav-learning" data-book="learning" aria-label="Open Learning book"></button><button class="hotspot nav-employment" data-book="employment" aria-label="Open Employment book"></button><button class="hotspot nav-involvement" data-book="involvement" aria-label="Open Involvement book"></button><button class="hotspot nav-news" data-modal="news" aria-label="Open News"></button><button class="hotspot nav-about" data-modal="about" aria-label="Open About and Contact"></button>
    <button class="hotspot shelf-employment" data-book="employment" aria-label="Bring the Employment book to the table"></button><button class="hotspot shelf-involvement" data-book="involvement" aria-label="Bring the Involvement book to the table"></button>
    <div id="bookStage" class="book-stage"><div class="book"><article class="page left"><p id="topicIndex" class="topic-index"></p><h1 id="topicTitle"></h1><div class="story"><img id="topicArt" alt="" src=""></div><p id="caption" class="caption"></p></article><article class="page right"><h2>Choose a module</h2><div id="modules" class="modules"></div></article><div id="fold" class="fold"><h3 id="foldTitle"></h3><div class="fold-lines"></div></div><div class="book-controls"><button id="prev">◀ PREV</button><button id="next">NEXT ▶</button></div></div></div>
    <aside id="modal" class="modal" role="dialog" aria-live="polite"></aside><div class="hint">Click a shelf book to swap it onto the table · PREV / NEXT turns pages · ← → also work</div>
  </section></main>
  <script>
    const $=id=>document.getElementById(id),stage=$('bookStage'),fold=$('fold'),modal=$('modal'),topicArt=$('topicArt');
    const sets={
      learning:{label:'LEARNING',modules:5,topics:[
        ['History','Coffee trade, culture, and cafés across time.','history'],['Origin','Places, people, climate, and varieties.','origin'],['Growing','Cultivation from seedling to ripe cherry.','growing'],['Processing','From harvest to green coffee.','processing'],['Roasting','Heat, time, and development shape flavor.','roasting'],['Quality Control','Cupping, grading, and consistency.','quality-control']]},
      employment:{label:'EMPLOYMENT',modules:4,topics:[
        ['Farming','Work at coffee’s agricultural beginning.','farming'],['Industry','Roasting, logistics, and operations.','industry'],['Retail','Café work and customer experience.','retail'],['Marketing','Coffee storytelling and design.','marketing']]},
      involvement:{label:'INVOLVEMENT',modules:2,topics:[
        ['Coffee Festivals','Meet growers, roasters, and coffee communities.','coffee-festivals'],['Coffee Competitions','Craft, skills, judges, and performance.','coffee-competitions']]},
      info:{label:'INFORMATION',modules:2,topics:[
        ['About & Contact','Learn more about the hub and reach out.','about-contact'],['News','Stories, events, and coffee updates.','news']]}
    };
    let active='learning',page=0,locked=false;
    function render(){const set=sets[active],[title,caption,artName]=set.topics[page];$('topicIndex').textContent=String(page+1).padStart(2,'0')+' / '+String(set.topics.length).padStart(2,'0');$('topicTitle').textContent=title.toUpperCase();$('caption').textContent=caption;topicArt.src='assets/page-art/'+artName+'.png';topicArt.alt=title+' pixel-art illustration';$('foldTitle').textContent=title.toUpperCase();$('modules').style.setProperty('--module-count',set.modules);$('modules').innerHTML=Array.from({length:set.modules},(_,i)=>'<button data-module="'+i+'"><span class="badge">'+(i+1)+'</span><span>Module '+(i+1)+'</span><span class="arrow">›</span></button>').join('');document.querySelectorAll('[data-module]').forEach(b=>b.onclick=()=>openModule(+b.dataset.module))}
    function turnTo(next,direction){if(locked||next===page)return;locked=true;fold.className='fold '+(direction==='back'?'turn-back':'turn-forward');setTimeout(()=>{page=next;render()},310);setTimeout(()=>{fold.className='fold';locked=false},650)}
    function swapBook(next){if(locked||next===active)return;locked=true;const returnX=active==='employment'?'-42%':active==='involvement'?'42%':'0%';const enterX=next==='employment'?'-42%':next==='involvement'?'42%':'0%';stage.style.setProperty('--return-x',returnX);stage.classList.add('returning');setTimeout(()=>{active=next;page=0;render();stage.classList.remove('returning');stage.style.setProperty('--enter-x',enterX);stage.classList.add('arriving')},580);setTimeout(()=>{stage.classList.remove('arriving');locked=false},1300)}
    document.querySelectorAll('[data-book]').forEach(b=>b.onclick=()=>swapBook(b.dataset.book));$('prev').onclick=()=>turnTo((page-1+sets[active].topics.length)%sets[active].topics.length,'back');$('next').onclick=()=>turnTo((page+1)%sets[active].topics.length,'forward');function openModule(index){const topic=sets[active].topics[page][0];modal.innerHTML='<h2>'+topic+' · Module '+(index+1)+'</h2><p>This module is reserved for the lesson content you will add later. It does not change the main topic page.</p><button onclick="closeModal()">CLOSE</button>';modal.classList.add('show')}
    document.querySelectorAll('[data-modal]').forEach(b=>b.onclick=()=>showModal(b.dataset.modal));function showModal(kind){modal.innerHTML=kind==='news'?'<h2>📰 NEWS</h2><p>Stories, events, and coffee updates will appear here.</p><button onclick="closeModal()">CLOSE</button>':'<h2>📚 ABOUT & CONTACT</h2><p>Coffee Learning Hub is an educational space for coffee, careers, and community.</p><p>hello@coffeelearninghub.example</p><button onclick="closeModal()">CLOSE</button>';modal.classList.add('show')}function closeModal(){modal.classList.remove('show')}window.closeModal=closeModal;
    document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')$('next').click();if(e.key==='ArrowLeft')$('prev').click();if(e.key==='Escape')closeModal()});render();
  </script>
</body>
</html>
